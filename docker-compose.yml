services:
  synapse-mcp:
    build: .
    container_name: synapse-mcp
    restart: unless-stopped
    # Bind on loopback in standalone Compose; publish externally via a TLS reverse proxy.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PORT=8000
      - SYNAPSE_MAX_CALLS_PER_MIN=60
    # No state volume, SQLite memory or remote execution in anonymous public mode.
